name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendlog
          POSTGRES_PASSWORD: spendlog
          POSTGRES_DB: spendlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendlog -d spendlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://spendlog:spendlog@localhost:5432/spendlog
      TEST_DATABASE_URL: postgresql+asyncpg://spendlog:spendlog@localhost:5432/spendlog_test
      SECRET_KEY: ci-secret-key-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: "true"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
